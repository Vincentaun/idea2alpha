<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Idea2Alpha outro</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap">
<style>
  :root { --paper: #ECF0F5; --ink: #14213D; --ink-2: #44516A; --line: #D2D9E4; --mark: #FFD84D; --accent: #2448C9; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1440px; height: 810px; overflow: hidden; background: var(--paper); color: var(--ink); font-family: "Atkinson Hyperlegible Next", system-ui, sans-serif; }
  .page { position: absolute; inset: 0; padding: 0 150px; display: grid; align-content: center; gap: 26px; }
  .brand { font-weight: 800; font-size: 72px; letter-spacing: -0.03em; line-height: 1; }
  .brand .hl { position: relative; padding: 0 0.12em; margin: 0 0.02em; }
  .brand .hl::before { content: ""; position: absolute; inset: 0.06em 0 0.02em; background: var(--mark); border-radius: 6px; z-index: -1; }
  .url { font-weight: 800; font-size: 76px; letter-spacing: -0.02em; color: var(--ink); }
  .url span { color: var(--ink-2); font-weight: 500; }
  .note { font-weight: 700; font-size: 30px; }
  .team { font-size: 22px; color: var(--ink-2); line-height: 1.5; border-top: 1px solid var(--line); padding-top: 22px; max-width: 60ch; }
  .page > * { opacity: 0; }
  .go .page > * { animation: rise 0.7s cubic-bezier(.2,.8,.2,1) forwards; }
  .go .url { animation-delay: 0.25s; } .go .note { animation-delay: 0.55s; } .go .team { animation-delay: 0.8s; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
  <div class="page">
    <div class="brand">Idea<span class="hl">2</span>Alpha</div>
    <div class="url"><span>Try it at </span>idea2alpha.pages.dev</div>
    <div class="note">For education and research only. Not investment advice.</div>
    <div class="team">Meng-Hing Aun and Yu-Chieh Hsiao, advisor Shang-En Tsai<br>Department of Computer Science and Information Engineering, Chang Jung Christian University</div>
  </div>
</body>
</html>
